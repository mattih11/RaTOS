#
# RaTOS distro - extends the upstream xenomai-demo distro and adds
# RaTOS-specific defaults on top.
#

require conf/distro/xenomai-demo.conf

# Keep concurrent C++ compilers within a practical memory budget. Four jobs is
# conservative for the MusicRaT build and can be overridden on larger hosts.
RATOS_BUILD_JOBS ?= "4"
BB_NUMBER_THREADS = "${RATOS_BUILD_JOBS}"
PARALLEL_MAKE = "-j ${RATOS_BUILD_JOBS}"
DEB_BUILD_OPTIONS += "parallel=${RATOS_BUILD_JOBS}"

# Include all RaTOS development headers and CMake config files in the SDK so
# host-side builds targeting the EVL guest can find_package() every dependency.
SDK_INSTALL += "libreflect-cpp-dev libsertial-dev libcorerat-dev corerat-tools libcommrat-dev"
