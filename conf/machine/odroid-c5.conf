#
# RaTOS Real-Time OS
#
# SPDX-License-Identifier: GPL-3.0-or-later
#
# Odroid C5 (Amlogic S905X5M, ARM64 / aarch64).
# U-Boot is raw-copied at 8 KiB on the SD/eMMC image; the FIP binary
# (u-boot.bin.sd.bin) must be provided by a u-boot-odroid-c5 recipe or
# installed via the Hardkernel Debian repository.
#

DISTRO_ARCH = "arm64"

IMAGE_FSTYPES ?= "wic wic.gz"
WKS_FILE ?= "odroid-c5.wks"

# Amlogic serial console (AML UART0)
MACHINE_SERIAL ?= "ttyAML0"
BAUDRATE_TTY   ?= "115200"

# DTB shipped with the kernel package (linux-image-arm64 / linux-xenomai-4)
DTB_FILES = "amlogic/meson-s905x5m-odroid-c5.dtb"

IMAGER_INSTALL:wic   += "u-boot-odroidc5"
IMAGER_BUILD_DEPS    += "u-boot-odroidc5"
