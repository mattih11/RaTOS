# RaTOS Real-Time OS
#
# SPDX-License-Identifier: GPL-3.0-or-later
#
# Odroid M1S (Rockchip RK3566, ARM64 / aarch64).
# U-Boot uses the standard Rockchip two-stage layout:
#   idbloader.img  at sector   64 (32 KiB)  — DDR init + SPL miniloader
#   u-boot.itb     at sector 16384 (8 MiB)  — U-Boot proper + TF-A BL31
# Both must be provided by a u-boot-odroid-m1s recipe or installed via the
# Hardkernel Debian repository.
#

DISTRO_ARCH = "arm64"

IMAGE_FSTYPES ?= "wic wic.gz"
WKS_FILE ?= "odroid-m1s.wks"

# Rockchip high-speed UART (FIQ debugger / ttyFIQ0 on Hardkernel BSP)
MACHINE_SERIAL ?= "ttyFIQ0"
BAUDRATE_TTY   ?= "1500000"

# DTB shipped with the kernel package
DTB_FILES = "rockchip/rk3566-odroid-m1s.dtb"

IMAGER_INSTALL:wic   += "u-boot-odroidm1s"
IMAGER_BUILD_DEPS    += "u-boot-odroidm1s"
