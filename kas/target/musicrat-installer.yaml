#
# RaTOS Real-Time OS - attended MusicRaT installer
#
# Composes with the Odroid H4 board and ISAR installer image fragment.
# The installer embeds the MusicRaT WIC and prompts before writing a disk.
#
# SPDX-License-Identifier: GPL-3.0-or-later
#

header:
  version: 14

target: mc:isar-installer:isar-image-installer

repos:
  isar:
    layers:
      meta-isar:

local_conf_header:
  installer_multiconfig: |
    BBMULTICONFIG += "isar-installer installer-target"

  target_bootstrapper: |
    TARGET_BOOTSTRAPPER_ADDITIONAL_PACKAGES ?= "deploy-image"
    TARGET_BOOTSTRAPPER_TASK_deploy-image[script] ?= "deploy-image-wic.sh"
    TARGET_BOOTSTRAPPER_TASK_deploy-image[workdir] ?= "/usr/bin"
    TARGET_BOOTSTRAPPER_TASK_deploy-image[effort] ?= "2"

  musicrat_installer: |
    INSTALLER_TARGET_IMAGE = "ratos-musicrat-image"
    INSTALLER_TARGET_IMAGES = "ratos-musicrat-image"
    TARGET_BOOTSTRAPPER_TTY_SERVICES ?= "getty@tty1 serial-getty@ttyS0"